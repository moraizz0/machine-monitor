name: CI - Build e Testes

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: 3. Instalar dependências (Maven)
        run: mvn -B dependency:go-offline

      - name: 4. Compilar a aplicação
        run: mvn -B compile

      - name: 5. Executar testes (JUnit 5 + MockMvc)
        run: mvn -B test

      - name: 6. Gerar o arquivo .jar
        run: mvn -B -DskipTests package

      - name: 7. Publicar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: machine-monitor-jar
          path: target/*.jar